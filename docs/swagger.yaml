host: localhost:8080
info:
  contact:
    email: support@synergyconnect.com
    name: API Support
  description: Университетская социальная сеть с полным набором функций
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://synergyconnect.com/terms
  title: SynergyConnect API
  version: 1.0.0
paths:
  /2fa/disable:
    post:
      consumes:
      - application/json
      description: Отключает 2FA после проверки кода
      parameters:
      - description: Код подтверждения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.Disable2FARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Отключение 2FA
      tags:
      - 2fa
  /2fa/enable:
    post:
      consumes:
      - application/json
      description: Подтверждает код и включает 2FA
      parameters:
      - description: Код подтверждения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.Enable2FARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Включение 2FA
      tags:
      - 2fa
  /2fa/initiate:
    post:
      description: Генерирует секрет и QR-код для Google Authenticator
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Initiate2FAResponse'
      security:
      - BearerAuth: []
      summary: Инициализация 2FA
      tags:
      - 2fa
  /2fa/recovery-codes:
    get:
      description: Возвращает коды восстановления
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                type: string
              type: array
            type: object
      security:
      - BearerAuth: []
      summary: Получение кодов восстановления
      tags:
      - 2fa
  /2fa/recovery-codes/regenerate:
    post:
      consumes:
      - application/json
      description: Генерирует новые коды восстановления
      parameters:
      - description: Код подтверждения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegenerateCodesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                type: string
              type: array
            type: object
      security:
      - BearerAuth: []
      summary: Перегенерация кодов восстановления
      tags:
      - 2fa
  /2fa/status:
    get:
      description: Проверяет, включена ли 2FA для пользователя
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
      security:
      - BearerAuth: []
      summary: Статус 2FA
      tags:
      - 2fa
  /2fa/verify:
    post:
      consumes:
      - application/json
      description: Проверяет правильность кода без изменения статуса
      parameters:
      - description: Код для проверки
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.Verify2FARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
      security:
      - BearerAuth: []
      summary: Проверка TOTP кода
      tags:
      - 2fa
  /admin/admins:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.UserResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Список администраторов
      tags:
      - admin
  /admin/admins/{id}:
    delete:
      parameters:
      - description: ID администратора
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Удаление администратора
      tags:
      - admin
  /admin/admins/demote/{id}:
    post:
      parameters:
      - description: ID администратора
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Понижение администратора
      tags:
      - admin
  /admin/admins/promote/{id}:
    post:
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Повышение до администратора
      tags:
      - admin
  /admin/comments:
    get:
      parameters:
      - default: 20
        description: Лимит
        in: query
        name: limit
        type: integer
      - default: 0
        description: Смещение
        in: query
        name: offset
        type: integer
      - description: Поиск
        in: query
        name: search
        type: string
      - description: ID поста
        in: query
        name: post_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CommentListResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Список комментариев
      tags:
      - admin
  /admin/comments/{id}:
    delete:
      parameters:
      - description: ID комментария
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Удаление комментария
      tags:
      - admin
  /admin/posts:
    get:
      parameters:
      - default: 20
        description: Лимит
        in: query
        name: limit
        type: integer
      - default: 0
        description: Смещение
        in: query
        name: offset
        type: integer
      - description: Поиск
        in: query
        name: search
        type: string
      - description: Категория
        in: query
        name: category
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PostListResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Список постов
      tags:
      - admin
  /admin/posts/{id}:
    delete:
      parameters:
      - description: ID поста
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
